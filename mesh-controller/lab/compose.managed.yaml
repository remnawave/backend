services:
  etcd:
    profiles: [legacy]
  spare:
    image: remnawave-mesh-lab:local
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes: ["./state:/state"]
    command: [sleep, infinity]
    networks:
      lab: {ipv4_address: 172.30.88.14}
